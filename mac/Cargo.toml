[package]
name = "homecalc-mac-launcher"
version = "2.1.0"
edition = "2021"
authors = ["Yanjun Wu <wuyj1996@gmail.com>"]
description = "HomeCalc standalone macOS launcher and embedded server"
license = "MIT"

[workspace]

[dependencies]
rust-embed = { version = "8.5", features = ["mime-guess"] }
mime_guess = "2.0"
open = "5.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
