name: Build macOS Application

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build-macos:
    runs-on: macos-latest # Runs on native Apple Silicon (M-series / arm64) runners

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WASM Engine & Frontend Assets
        run: |
          wasm-pack build crates/engine-wasm --target web --out-dir ../../web/src/wasm
          cd web
          npm ci
          npm run build
          cd ..

      - name: Compile Desktop Launcher (Mach-O ARM64)
        run: |
          cargo build --release -p desktop-launcher --target aarch64-apple-darwin

      - name: Package into Standalone HomeCalc.app Bundle
        run: |
          mkdir -p HomeCalc.app/Contents/MacOS
          mkdir -p HomeCalc.app/Contents/Resources

          # Copy binary
          cp target/aarch64-apple-darwin/release/desktop-launcher HomeCalc.app/Contents/MacOS/HomeCalc
          chmod +x HomeCalc.app/Contents/MacOS/HomeCalc

          # Generate Info.plist
          cat << 'EOF' > HomeCalc.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>HomeCalc</string>
              <key>CFBundleIdentifier</key>
              <string>com.homecalc.app</string>
              <key>CFBundleName</key>
              <string>HomeCalc</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>12.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          # Zip the app bundle preserving symlinks and permissions
          zip -r -y HomeCalc-macOS-AppleSilicon.zip HomeCalc.app

      - name: Upload Finished App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCalc-macOS-AppleSilicon
          path: HomeCalc-macOS-AppleSilicon.zip
          retention-days: 7
